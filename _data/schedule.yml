# Schedule data.
#
# 'content' and 'readings' are the single source of truth — edit once here and
# both section views update. Index n corresponds to c: n in the section lists.
#
# 'mw' (Section 001, Mon/Wed) and 'tr' (Sections 002 & 003, Tue/Thu) map each
# date to a content number (c:) or a literal label (special:).
# Specials in use: MIDTERM, NO CLASS.
#
# A row may carry 'due:', a note shown under the topic (e.g. a homework due date).
#
# A row may also carry its own 'reading:', which overrides readings[c] for that
# one date. Use it when a reading is due at different meeting numbers in the two
# sections — e.g. the first meeting of a given week is c:8 for MW but c:9 for TR.
#
# Through the midterm, 002/003 run one content number ahead of 001, because they
# never lost Labor Day. From Wed Oct 14 (001) and Thu Oct 15 (002/003) the two
# sections share content numbers: 001 has one meeting more and spends it on a
# second day of presentations.
#
# HOW MUCH IS PUBLISHED is controlled by mw_rows / tr_rows in schedule.md,
# not here. Fill topics in below ahead of time; they stay hidden until released.
#
# DATES ASSUME first day of class Mon Aug 31 2026.

