# Schedule data.
#
# 'content' is the single source of truth for topics — edit a topic ONCE here
# and it updates in both section views.
#
# 'mw' (Section 001, Mon/Wed) and 'tr' (Sections 002 & 003, Tue/Thu) map each
# meeting date to a content number, or to a special: MIDTERM, REVIEW, CLINIC.
#
# Section 001 loses Labor Day (Mon Sep 7) and makes it up Mon Nov 9, so it runs
# one meeting behind 002/003 for most of the term. That is why 002/003 get a
# REVIEW slot before the midterm and 001 gets a CLINIC slot after it — the two
# patterns cover identical examinable content.
#
# DATES ASSUME first day of class Mon Aug 31 2026. Verify against the academic calendar.

